<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יאיר או לא יאיר? 🎯</title>
  <style>
    :root {
      --bg: #0f111a;
      --card-bg: #1a1e2e;
      --card-border: #2a3048;
      --text: #ffffff;
      --text-muted: #9ba3bf;
      --primary: #6366f1;
      --accent-yes: #10b981;
      --accent-no: #f43f5e;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Heebo", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f111a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      cursor: pointer;
      user-select: none;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #f43f5e, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 30px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    /* Start Screen */
    .input-group {
      margin-bottom: 20px;
      text-align: right;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: #111422;
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s;
      text-align: right;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Quiz Screen */
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #111422;
      border-radius: 999px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.15);
      padding: 4px 12px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 15px;
    }

    .question-text {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 30px;
      min-height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .btn-vote {
      padding: 20px 10px;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: 800;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s;
    }

    .btn-vote:active {
      transform: scale(0.94);
    }

    .btn-yes {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .btn-no {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fb7185;
    }

    /* Thank You Screen */
    .thank-you-wrap {
      text-align: center;
      padding: 20px 0;
    }

    .icon-done {
      width: 80px;
      height: 80px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      border-radius: 50%;
      margin: 0 auto 20px auto;
    }

    .sync-status {
      font-size: 0.9rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      padding: 8px 16px;
      border-radius: 999px;
      display: inline-block;
      margin-top: 15px;
    }

    /* Modal / Admin */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-card {
      background: #171b29;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.8rem;
      color: #4b5563;
    }

    footer span {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header id="mainHeader" title="הצבעה ליאיר">
      <h1 id="logoTitle">🎯 יאיר או לא יאיר?</h1>
      <p>שאלון ההיכרות הרשמי</p>
    </header>

    <!-- Start View -->
    <div id="startScreen" class="card">
      <div class="input-group">
        <label for="userName">מה השם שלך? (אפשר גם כינוי)</label>
        <input type="text" id="userName" placeholder="הכנס שם...">
      </div>
      <button class="btn btn-primary" onclick="startQuiz()">בואו נתחיל להצביע! 🚀</button>
    </div>

    <!-- Question View -->
    <div id="quizScreen" class="card hidden">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div class="question-badge" id="questionCounter">שאלה 1 מתוך 10</div>
      <div class="question-text" id="questionText">טוען שאלה...</div>

      <div class="actions-grid">
        <button class="btn-vote btn-yes" onclick="submitAnswer('יאיר')">
          <span style="font-size: 1.8rem;">😎</span>
          <span>יאיר לגמרי!</span>
        </button>
        <button class="btn-vote btn-no" onclick="submitAnswer('לא יאיר')">
          <span style="font-size: 1.8rem;">🙅‍♂️</span>
          <span>ממש לא יאיר</span>
        </button>
      </div>
    </div>

    <!-- Thank You View -->
    <div id="thankYouScreen" class="card hidden">
      <div class="thank-you-wrap">
        <div class="icon-done">✨</div>
        <h2 id="thankYouTitle" style="font-size: 1.7rem; margin-bottom: 10px;">תודה שהצבעת!</h2>
        <p style="color: var(--text-muted); line-height: 1.6;">התשובות שלך נקלטו בהצלחה בגיליון התוצאות.<br>התוצאות המלאות יוצגו על המסך בסוף האירוע!</p>
        <div class="sync-status">🟢 נשמר ישירות בגיליון YAIRDB</div>
      </div>
    </div>

    <footer>
      <span onclick="triggerAdminLogin()">🔒</span>
    </footer>
  </div>

  <!-- Admin Login Modal -->
  <div id="adminModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 style="margin-bottom: 16px; text-align: center;">כניסת מנהל בלבד</h3>
      <div class="input-group">
        <input type="password" id="adminPassword" placeholder="הזן סיסמת ניהול...">
      </div>
      <button class="btn btn-primary" onclick="verifyAdminPassword()" style="margin-bottom: 10px;">כניסה לגיליון</button>
      <button class="btn" onclick="closeAdminModal()" style="background: transparent; color: var(--text-muted);">ביטול</button>
    </div>
  </div>

  <script>
    // הקישור הישיר ל-Google Apps Script המחובר ל-YAIRDB
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzf8U8iJNIRQpVMdd3gBXbLi5TDKzf-Sdih5DohmCIZGvwDtIcIsMIa8GGzTYtaWmMA/exec";
    const SHEET_VIEW_URL = "https://docs.google.com/spreadsheets/d/1mJoE14Vh-m5XSIsFLMFqJYSfPXiCakbtfn8NIjlxzHA/edit?gid=0#gid=0";

    const questions = [
      "יאיר מסוגל לשמוע פתיחת שקית חטיפים משלושה חדרים, אבל לא שומע כשקוראים לו לבוא לעזור.",
      "יאיר כבר בדק אם בר מצווה מאפשרת להוציא רישיון נהיגה — לפחות לקורקינט.",
      "כשהוא אומר ״אני מוכן, יוצאים״ — הוא עדיין נועל נעליים.",
      "כשהיה קטן, יאיר רצה להיות רופא.",
      "יאיר מאמין שלשים צלחת בכיור זה לעזור, ולהכניס למדיח זה כבר לעבוד בהתנדבות.",
      "יאיר מסוגל לזכור סיסמה של משחק מלפני שלוש שנים, אבל לא איפה הניח את הנעליים לפני חמש דקות.",
      "המשפט ״אני הולך לישון מוקדם ״ אצל יאיר זה פעם בשבוע.",
      "כשיאיר מסדר את החדר, הארון נהיה קצת יותר מלא והדלת קצת יותר קשה לסגירה.",
      "יאיר מוכן לחלוק הכול עם האחים שלו — חוץ מהמטען, החטיפים והמקום על הספה.",
      "פעם יאיר הצליח לשכנע את ההורים שהוא יודע לבשל."
    ];

    let currentQuestionIndex = 0;
    let participantName = "";
    let userAnswers = [];

    // בדיקה האם כבר הצביע במכשיר זה
    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("hasVoted_Yair")) {
        showThankYou(localStorage.getItem("votedName") || "");
      }
    });

    function startQuiz() {
      const input = document.getElementById("userName");
      participantName = input.value.trim() || "אורח/ת";
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("quizScreen").classList.remove("hidden");
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentQuestionIndex];
      document.getElementById("questionText").innerText = q;
      document.getElementById("questionCounter").innerText = `שאלה ${currentQuestionIndex + 1} מתוך ${questions.length}`;
      const progress = ((currentQuestionIndex) / questions.length) * 100;
      document.getElementById("progressFill").style.width = `${progress}%`;
    }

    function submitAnswer(answer) {
      userAnswers.push(answer);
      currentQuestionIndex++;

      if (currentQuestionIndex < questions.length) {
        renderQuestion();
      } else {
        document.getElementById("progressFill").style.width = `100%`;
        finishAndSave();
      }
    }

    async function finishAndSave() {
      document.getElementById("quizScreen").classList.add("hidden");
      showThankYou(participantName);

      localStorage.setItem("hasVoted_Yair", "true");
      localStorage.setItem("votedName", participantName);

      // שליחה מאובטחת לענן ללא חסימת CORS
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: participantName,
            answers: userAnswers
          })
        });
      } catch (err) {
        console.error("שגיאה בשמירת התשובות:", err);
      }
    }

    function showThankYou(name) {
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("quizScreen").classList.add("hidden");
      if (name) {
        document.getElementById("thankYouTitle").innerText = `תודה שהצבעת, ${name}! 🎉`;
      }
      document.getElementById("thankYouScreen").classList.remove("hidden");
    }

    // ניהול סודי
    let clickCount = 0;
    let clickTimer;
    document.getElementById("logoTitle").addEventListener("click", () => {
      clickCount++;
      clearTimeout(clickTimer);
      if (clickCount >= 5) {
        triggerAdminLogin();
        clickCount = 0;
      }
      clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
    });

    function triggerAdminLogin() {
      document.getElementById("adminModal").classList.remove("hidden");
      document.getElementById("adminPassword").focus();
    }

    function closeAdminModal() {
      document.getElementById("adminModal").classList.add("hidden");
      document.getElementById("adminPassword").value = "";
    }

    function verifyAdminPassword() {
      const pass = document.getElementById("adminPassword").value.trim();
      if (pass === "443894") {
        // מעבר ישיר לגיליון התוצאות החי
        window.open(SHEET_VIEW_URL, "_blank");
        closeAdminModal();
      } else {
        alert("קוד שגוי! נסה שוב.");
      }
    }
  </script>
</body>
</html>
